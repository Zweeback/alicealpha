apiVersion: apps/v1
kind: Deployment
metadata:
  name: alice
  labels:
    app: alice
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: alice
  template:
    metadata:
      labels:
        app: alice
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: alice
          image: ghcr.io/zweeback/alicealpha:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: OPENAI_REALTIME_MODEL
              value: "gpt-realtime-2.1"
            - name: OPENAI_REALTIME_VOICE
              value: "marin"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alice-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ALICE_OLLAMA_URL
              valueFrom:
                secretKeyRef:
                  name: alice-secrets
                  key: ALICE_OLLAMA_URL
                  optional: true
            - name: ALICE_OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: alice-secrets
                  key: ALICE_OLLAMA_MODEL
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: alice
spec:
  selector:
    app: alice
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
