<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>Alice OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/alice.css" />
</head>
<body>
  <div id="app" class="shell">
    <aside class="rail" aria-label="Navigation">
      <div class="mark" title="Alice Core">A</div>
      <nav class="nav">
        <button type="button" data-view="presence" class="nav-btn active" title="Präsenz">◈</button>
        <button type="button" data-view="memory" class="nav-btn" title="Gedächtnis">◎</button>
        <button type="button" data-view="graph" class="nav-btn" title="Graph">⬡</button>
        <button type="button" data-view="tribunal" class="nav-btn" title="Tribunal">▣</button>
        <button type="button" data-view="settings" class="nav-btn" title="Settings">⚙</button>
      </nav>
    </aside>

    <div class="main">
      <header class="top">
        <div>
          <h1 class="title">Alice OS</h1>
          <p class="sub">Core · Backend <span id="backend-label">lokal (v0.1)</span></p>
        </div>
        <div class="emotion-chip" id="emotion-chip">idle</div>
      </header>

      <div class="workspace">
        <section class="stage" id="stage">
          <!-- views injected -->
        </section>
        <section class="chat-dock" id="chat-dock">
          <header class="chat-head">
            <span>Gespräch</span>
            <span class="muted" id="mem-badge">0 Erinnerungen</span>
          </header>
          <div class="messages" id="messages"></div>
          <div class="hints" id="hints"></div>
          <form class="composer" id="composer">
            <button type="button" id="btn-mic" class="icon-btn" title="Sprechen" hidden>🎙</button>
            <textarea id="input" rows="1" placeholder="Zu Alice Core…" autocomplete="off"></textarea>
            <button type="submit" class="send" title="Senden">↑</button>
          </form>
        </section>
      </div>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Mobil">
    <button type="button" data-view="presence" class="active">Präsenz</button>
    <button type="button" data-view="memory">Gedächtnis</button>
    <button type="button" data-view="graph">Graph</button>
    <button type="button" data-view="tribunal">Tribunal</button>
    <button type="button" data-view="settings">Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
