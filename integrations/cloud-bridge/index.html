<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALICE · Cloud Bridge</title><style>body{font:16px system-ui,sans-serif;background:#0b1020;color:#e9f0ff;margin:0}main{max-width:640px;margin:12vh auto;padding:28px}h1{font-size:34px}p{line-height:1.6;color:#b8c6e0}.panel{padding:22px;border:1px solid #3c4761;border-radius:18px;background:#141d35}.ok{color:#7de3b3}.muted{font-size:14px;color:#aab5c9}</style></head><body><main><h1>ALICE <span style="color:#91baff">Cloud Bridge</span></h1><p>Eigene Cloud-Verbindung für Android, Chat-Automationen und n8n-kompatible Webhooks — ohne abgelaufene Trial.</p><section class="panel"><h2>Verbindung</h2><p id="status">Prüfung läuft …</p><p class="muted">Private Nachrichten werden nicht gespeichert. Gerätezugriff ist noch nicht aktiviert; dafür ist eine Geräte-Kopplung erforderlich.</p></section></main><script>fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).then(j=>{document.getElementById('status').textContent=j.ok?'● API online · Authentifizierung vorgesehen · Speicher noch nicht verbunden':'API nicht bereit';document.getElementById('status').className=j.ok?'ok':''}).catch(()=>{document.getElementById('status').textContent='API nicht erreichbar'})</script></body></html>
