name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - name: Runtime smoke test
        shell: bash
        run: |
          npm run server > /tmp/alice-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/alice-server.log' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/health               | tee /tmp/alice-health.json               | grep -q '"ok":true'; then
              TRACE_ID="865c30df-befd-4f62-953d-0dc44d7125bf"
              curl --fail --silent --show-error \
                -H "X-Alice-Trace-Id: ${TRACE_ID}" \
                -D /tmp/alice-trace-headers.txt \
                -o /tmp/alice-trace-body.json \
                http://127.0.0.1:8787/api/health
              grep -qi "^x-alice-trace-id: ${TRACE_ID}" /tmp/alice-trace-headers.txt
              for log_attempt in {1..20}; do
                if grep -q "\"trace_id\":\"${TRACE_ID}\"" /tmp/alice-server.log; then
                  exit 0
                fi
                sleep 0.1
              done
              echo "Trace acknowledgement was not logged by Alice server" >&2
              exit 1
            fi
            sleep 1
          done

          echo "Alice runtime did not become healthy in time." >&2
          exit 1
