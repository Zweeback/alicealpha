name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: GLaDOS sidecar HTTP contract (no model dependencies)
        run: python -m unittest discover -s tests -p 'test_glados_sidecar.py' -v
      - run: npm ci
      - run: npm run test:run
      - run: npm run test:unreal-scaffold
      - run: npm run build
      - name: Runtime smoke test
        shell: bash
        run: |
          npm run server > /tmp/alice-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/alice-server.log' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/health               | tee /tmp/alice-health.json               | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done

          echo "Alice runtime did not become healthy in time." >&2
          exit 1


  alice-glb-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          nohup npm run preview -- --port 4173 >/tmp/alice-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS 'http://127.0.0.1:4173/?viewer=vrm' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alice-preview.log
          exit 1
      - name: Load and render the actual bundled GLB
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: [
              '--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader'
            ]});
            try {
              const page = await browser.newPage({ viewport: { width: 412, height: 915 }, deviceScaleFactor: 1 });
              const errors = [];
              const glbResponses = [];
              page.on('pageerror', error => errors.push(error.message));
              page.on('response', response => {
                if (response.url().includes('alice-fbx-source.glb')) {
                  glbResponses.push({ status: response.status(), url: response.url() });
                }
              });
              await page.goto('http://127.0.0.1:4173/?viewer=vrm', { waitUntil: 'domcontentloaded' });
              await page.getByRole('status').filter({ hasText: 'GLB-Rohansicht · VRM-Runtime nicht aktiv' }).waitFor({ timeout: 90000 });
              await page.waitForTimeout(1200);
              const status = await page.getByRole('status').innerText();
              const alert = await page.locator('[role=alert]').allTextContents();
              const audit = await page.locator('.vrm-audit dd').allTextContents();
              const canvas = await page.locator('.vrm-stage canvas').evaluate(element => ({
                width: element.width,
                height: element.height,
                pngBytes: element.toDataURL('image/png').length
              }));
              const result = { status, audit, glbResponses, errors, canvas };
              console.log('ALICE_GLB_BROWSER_RESULT=' + JSON.stringify(result));
              fs.writeFileSync('alice-glb-browser-result.json', JSON.stringify(result, null, 2));
              await page.screenshot({ path: 'alice-glb-mobile.png', fullPage: true });
              await page.getByRole('button', { name: 'Seite' }).click();
              await page.screenshot({ path: 'alice-glb-side.png', fullPage: true });
              if (!glbResponses.some(response => response.status === 200)) throw new Error('Bundled GLB did not return HTTP 200');
              if (!Number(audit[1])) throw new Error('No mesh was loaded');
              if (canvas.width < 100 || canvas.height < 100 || canvas.pngBytes < 1000) throw new Error('WebGL canvas is empty');
              if (alert.length || errors.length) throw new Error('Browser errors: ' + [...alert, ...errors].join(' | '));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alice-glb-browser-proof
          path: |
            alice-glb-browser-result.json
            alice-glb-mobile.png
            alice-glb-side.png
          if-no-files-found: warn
