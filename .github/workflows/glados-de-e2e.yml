name: GLaDOS DE E2E synthesis proof isolated branch
on:
  push:
    branches:
      - experiment/glados-de-e2e-20261107
    paths:
      - 'experiments/glados_de/**'
      - '.github/workflows/glados-de-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Piper TTS
        run: python -m pip install -r experiments/glados_de/requirements.txt
      - name: Strict original German model and real WAV synthesis
        run: python experiments/glados_de/probe.py
      - name: Publish audio verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glados-de-voice-proof
          path: experiments/glados_de/proof/
          if-no-files-found: warn
          retention-days: 3
