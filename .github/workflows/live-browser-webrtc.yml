name: Live Browser WebRTC

on:
  pull_request:
    paths:
      - '.github/workflows/live-browser-webrtc.yml'
      - 'tests/live-webrtc.spec.js'
  workflow_dispatch:

jobs:
  chromium-webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build branch app for local browser checks
        run: npm run build

      - name: Start branch app
        shell: bash
        run: |
          PORT=8790 npm run server > /tmp/alice-branch-server.log 2>&1 &
          echo $! > /tmp/alice-branch-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alice-branch-server.log
          exit 1

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run live browser WebRTC probe
        run: npx playwright test tests/live-webrtc.spec.js --reporter=line
        env:
          CI: 'true'
        shell: bash
