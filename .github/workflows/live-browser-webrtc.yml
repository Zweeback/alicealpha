name: Live Browser WebRTC

on:
  pull_request:
    paths:
      - '.github/workflows/live-browser-webrtc.yml'
      - 'tests/live-webrtc.spec.js'
  workflow_dispatch:

jobs:
  chromium-webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx -y @playwright/test@1.55.0 install --with-deps chromium

      - name: Run live browser WebRTC probe
        run: npx -y @playwright/test@1.55.0 test tests/live-webrtc.spec.js --reporter=line
        env:
          CI: 'true'
        shell: bash
