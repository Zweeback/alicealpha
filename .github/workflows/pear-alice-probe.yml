name: PEAR Alice Probe

on:
  pull_request:
    paths:
      - '.github/workflows/pear-alice-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download canonical Alice reference
        run: |
          curl -L --fail --retry 3             -o alice-reference.jpg             "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/56a729acb797c0fec9f7929625a7d774a377914d15b1b771f650af724c1a6809.jpg"

      - name: Probe PEAR Hugging Face Space
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:1000},acceptDownloads:true});
            page.setDefaultTimeout(30000);

            const urls=[
              'https://bestwjh-pear.hf.space/',
              'https://huggingface.co/spaces/BestWJH/PEAR'
            ];
            let opened=false;
            for (const url of urls) {
              try {
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
                await page.waitForTimeout(12000);
                const body=(await page.locator('body').innerText()).slice(0,5000);
                console.log('URL',page.url());
                console.log('BODY',body);
                if (/PEAR|image|upload|mesh|human/i.test(body) && !/runtime error/i.test(body)) { opened=true; break; }
              } catch(e) { console.log('OPEN_ERR',url,String(e)); }
            }
            if(!opened) throw new Error('PEAR Space did not open');

            await page.screenshot({path:'pear-before.png',fullPage:true});

            const inputs=page.locator('input[type=file]');
            console.log('FILE_INPUTS',await inputs.count());
            if(await inputs.count()<1) throw new Error('No PEAR upload input');
            await inputs.first().setInputFiles('alice-reference.jpg');
            await page.waitForTimeout(5000);
            await page.screenshot({path:'pear-loaded.png',fullPage:true});

            const btnPatterns=[/run/i,/infer/i,/generate/i,/submit/i,/process/i,/reconstruct/i];
            let clicked=false;
            for(const re of btnPatterns){
              const b=page.getByRole('button',{name:re}).first();
              if(await b.count()){
                try{await b.click(); clicked=true; console.log('CLICKED',re.toString()); break;}catch{}
              }
            }
            if(!clicked) throw new Error('No PEAR run button');

            const deadline=Date.now()+10*60*1000;
            let done=false;
            while(Date.now()<deadline){
              await page.waitForTimeout(10000);
              const body=await page.locator('body').innerText();
              console.log('POLL',new Date().toISOString(),body.slice(-2500));
              await page.screenshot({path:'pear-progress.png',fullPage:true});
              const dl=page.locator('a[download], a[href$=".obj"], a[href$=".ply"], a[href$=".glb"], a[href$=".npz"]');
              const canvases=page.locator('canvas');
              if(await dl.count() || await canvases.count()>1){
                done=true;
                break;
              }
              if(/quota exceeded|runtime error/i.test(body)) break;
            }

            await page.screenshot({path:'pear-final.png',fullPage:true});
            console.log('DONE',done);
            const links=page.locator('a[download], a[href$=".obj"], a[href$=".ply"], a[href$=".glb"], a[href$=".npz"]');
            for(let i=0;i<await links.count();i++) console.log('LINK',i,await links.nth(i).getAttribute('href'));
            await browser.close();
          })();
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alice-pear-probe
          path: pear-*.png
          if-no-files-found: warn
