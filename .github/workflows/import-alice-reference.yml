name: Import Alice Reference

on:
  push:
    branches:
      - feat/alice-work-partner-20260928
    paths:
      - '.github/workflows/import-alice-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alice-work-partner-20260928
          persist-credentials: true
      - name: Download canonical Alice human reference
        run: |
          curl -L --fail --retry 3 \
            -o public/alice-reference.jpg \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/56a729acb797c0fec9f7929625a7d774a377914d15b1b771f650af724c1a6809.jpg"
          file public/alice-reference.jpg
          test "$(stat -c%s public/alice-reference.jpg)" -gt 10000
      - name: Commit reference to work-partner branch
        run: |
          git config user.name "alice-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/alice-reference.jpg
          if git diff --cached --quiet; then
            echo "Reference already current."
            exit 0
          fi
          git commit -m "asset: add canonical human Alice reference"
          git push origin HEAD:feat/alice-work-partner-20260928
