name: Capture Live Alice Screenshot
# rerun after canvas startup fix

on:
  pull_request:
    paths:
      - '.github/workflows/capture-live-screenshot.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture live mobile screenshot
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 412, height: 915 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
            });
            await page.goto('https://alicealpha.onrender.com/', {
              waitUntil: 'networkidle',
              timeout: 90000,
            });
            await page.waitForTimeout(5000);
            console.log('TITLE', await page.title());
            console.log('URL', page.url());
            console.log('BODY', (await page.locator('body').innerText()).slice(0, 1200));
            await page.screenshot({
              path: 'alice-live-mobile.png',
              fullPage: true,
            });
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: alice-live-screenshot
          path: alice-live-mobile.png
          if-no-files-found: error
