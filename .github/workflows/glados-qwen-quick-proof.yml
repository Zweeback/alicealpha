name: GLaDOS Qwen3 prebuilt inference final proof
on:
  push:
    branches: [experiment/glados-de-e2e-20261107]
    paths: ['.github/workflows/glados-qwen-quick-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obtain official pinned llama-server release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/llamabin
          curl -fLsS --retry 3 'https://github.com/ggml-org/llama.cpp/releases/download/b12189/llama-b12189-bin-ubuntu-x64.tar.gz' -o /tmp/llama.tar.gz
          tar -xzf /tmp/llama.tar.gz -C /tmp/llamabin
          find /tmp/llamabin -name llama-server -type f -print
      - name: Obtain hash-pinned Qwen3-0.6B Q4_K_M
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --max-time 300 'https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf' -o /tmp/qwen.gguf
          test "$(head -c4 /tmp/qwen.gguf)" = GGUF
          printf '%s  %s\n' ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a /tmp/qwen.gguf | sha256sum -c -
      - name: Ask local model in German
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find /tmp/llamabin -name llama-server -type f | head -1)"
          chmod +x "$EXE"
          export LD_LIBRARY_PATH="$(dirname "$EXE")"
          "$EXE" -m /tmp/qwen.gguf --alias local-qwen --host 127.0.0.1 --port 8080 --ctx-size 2048 --threads 2 > /tmp/llama.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 100); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health 2>/dev/null | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { tail -100 /tmp/llama.log; exit 1; }
          python - <<'PY'
          import urllib.request,json
          body={"model":"local-qwen","messages":[{"role":"system","content":"Antworte auf Deutsch in maximal zwei Sätzen."},{"role":"user","content":"Was ist die Hauptstadt von Deutschland?"}],"temperature":0.2,"max_tokens":150,"stream":False,"chat_template_kwargs":{"enable_thinking":False}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(body).encode(),headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=120) as x:r=json.load(x)
          answer=r["choices"][0]["message"]["content"]
          assert isinstance(answer,str) and answer.strip(),r
          assert "<think>" not in answer,answer
          print("PASS: local real GGUF response:",answer[:250])
          PY
