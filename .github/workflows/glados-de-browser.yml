name: GLaDOS DE Chromium offline browser test
on:
  push:
    branches:
      - experiment/glados-de-e2e-20261107
    paths:
      - 'experiments/glados_de/web_smoke.py'
      - '.github/workflows/glados-de-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Piper and Chromium test runtime
        run: |
          python -m pip install -r experiments/glados_de/requirements.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build pinned offline voice and runtime
        run: bash experiments/glados_de/build_assets.sh
      - name: Test actual offline Chromium Piper WASM synthesizer
        run: python experiments/glados_de/web_smoke.py
      - name: Upload screenshot and machine-readable verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glados-de-chromium-browser-proof
          path: experiments/glados_de/proof/
          if-no-files-found: warn
          retention-days: 3
