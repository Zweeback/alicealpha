<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ---- Lip sync (unchanged from the Alice lip-sync viewer) ----
const PROTOS = {            // female-voice vowel prototypes (Hz): [F1, F2]
  aa: [850, 1250],
  ee: [580, 2350],
  ih: [360, 2650],
  oh: [520, 950],
  ou: [370, 920],
};
const GAIN = { aa: 1.0, oh: 0.9, ee: 0.75, ih: 0.55, ou: 0.85 };   // max opening per shape

class LipSync {
  constructor(opts = {}) {
    this.attack = opts.attack ?? 0.045;     // seconds (time constants)
    this.release = opts.release ?? 0.11;
    this.noiseFloor = 0;
    this._ring = new Float32Array(120).fill(1); this._ri = 0;   // ~2 s of per-frame loudness, for the noise floor
    this.peak = 0;
    this.out = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    this.volume = 0;
    this.f1 = 0; this.f2 = 0; this.voiced = false;
  }

  reset() { for (const k in this.out) this.out[k] = 0; this.volume = 0; }

  // frame: Float32Array (mono PCM, ~20-40 ms), sr: sample rate, dt: seconds since last call
  update(frame, sr, dt) {
    const { rms, f1, f2, voiced } = analyzeFrame(frame, sr);
    // noise floor = quietest frame of the last ~2 s; loudness reference follows the recent peak (auto gain)
    this._ring[this._ri++ % 120] = rms;
    let mn = 1; for (let i = 0; i < 120; i++) if (this._ring[i] < mn) mn = this._ring[i];
    this.noiseFloor = mn;
    this.peak = Math.max(rms, this.peak * Math.exp(-Math.max(dt, 1e-3) / 4));
    const gate = Math.min(0.03, Math.max(0.006, mn * 2.5));
    const ref = Math.max(0.04, Math.min(0.15, this.peak * 0.8));
    let open = Math.max(0, Math.min(1, (rms - gate) / ref));
    open = Math.pow(open, 0.75);
    this.volume = open; this.f1 = f1; this.f2 = f2; this.voiced = voiced;

    const target = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    if (open > 0.01) {
      let sum = 0;
      const w = {};
      for (const k in PROTOS) {
        const d1 = (Math.log(Math.max(f1, 150)) - Math.log(PROTOS[k][0])) / 0.20;
        const d2 = (Math.log(Math.max(f2, 400)) - Math.log(PROTOS[k][1])) / 0.26;
        w[k] = Math.exp(-0.5 * (d1 * d1 + d2 * d2));
        sum += w[k];
      }
      const voicedScale = voiced ? 1 : 0.45;           // fricatives / noise: smaller, ih-ish mouth
      for (const k in PROTOS) {
        const share = sum > 1e-9 ? w[k] / sum : 0;
        target[k] = share * GAIN[k] * open * voicedScale;
      }
      if (!voiced) target.ih = Math.max(target.ih, 0.25 * open);
    }
    for (const k in target) {
      const tau = target[k] > this.out[k] ? this.attack : this.release;
      const a = 1 - Math.exp(-Math.max(dt, 1e-3) / tau);
      this.out[k] += (target[k] - this.out[k]) * a;
    }
    return this.out;
  }
}

// ---------- DSP ----------
function analyzeFrame(x, sr) {
  const n = x.length;
  let e = 0;
  for (let i = 0; i < n; i++) e += x[i] * x[i];
  const rms = Math.sqrt(e / n);
  if (rms < 1e-4) return { rms, f1: 0, f2: 0, voiced: false };

  // decimate to ~11 kHz with a box filter
  const dec = Math.max(1, Math.round(sr / 11025));
  const fs = sr / dec;
  const m = Math.floor(n / dec);
  const y = new Float64Array(m);
  for (let i = 0; i < m; i++) {
    let s = 0;
    for (let j = 0; j < dec; j++) s += x[i * dec + j];
    y[i] = s / dec;
  }
  // pre-emphasis + hann
  const z = new Float64Array(m);
  for (let i = 0; i < m; i++) {
    const prev = i > 0 ? y[i - 1] : 0;
    z[i] = (y[i] - 0.97 * prev) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (m - 1)));
  }
  // autocorrelation
  const order = Math.min(14, 2 + Math.round(fs / 1000));
  const r = new Float64Array(order + 1);
  for (let k = 0; k <= order; k++) {
    let s = 0;
    for (let i = 0; i < m - k; i++) s += z[i] * z[i + k];
    r[k] = s;
  }
  if (r[0] < 1e-9) return { rms, f1: 0, f2: 0, voiced: false };
  // periodicity (voicing) from the autocorrelation of the raw decimated signal, lag 2.5..12 ms
  const lo = Math.floor(fs * 0.0025), hi = Math.min(m - 1, Math.floor(fs * 0.012));
  let r0 = 0; for (let i = 0; i < m; i++) r0 += y[i] * y[i];
  let best = 0;
  for (let lag = lo; lag <= hi; lag++) {
    let s = 0; for (let i = 0; i < m - lag; i++) s += y[i] * y[i + lag];
    if (s > best) best = s;
  }
  const voiced = r0 > 0 && best / r0 > 0.35;

  // Levinson-Durbin
  r[0] *= 1.0001;
  let a = new Float64Array(order + 1); a[0] = 1;
  let err = r[0];
  for (let i = 1; i <= order; i++) {
    let acc = r[i];
    for (let j = 1; j < i; j++) acc += a[j] * r[i - j];
    const k = -acc / err;
    const na = a.slice();
    for (let j = 1; j < i; j++) na[j] = a[j] + k * a[i - j];
    na[i] = k;
    a = na;
    err *= (1 - k * k);
    if (err < 1e-12) break;
  }
  // LPC magnitude spectrum on a grid, pick first two peaks
  const N = 220, f0 = 200, f1m = 3600;
  const mag = new Float64Array(N);
  for (let g = 0; g < N; g++) {
    const f = f0 + ((f1m - f0) * g) / (N - 1);
    const w = (2 * Math.PI * f) / fs;
    let re = 0, im = 0;
    for (let k = 0; k <= order; k++) { re += a[k] * Math.cos(w * k); im -= a[k] * Math.sin(w * k); }
    mag[g] = 1 / Math.sqrt(re * re + im * im + 1e-12);
  }
  const peaks = [];
  for (let g = 1; g < N - 1; g++) {
    if (mag[g] > mag[g - 1] && mag[g] >= mag[g + 1]) peaks.push({ f: f0 + ((f1m - f0) * g) / (N - 1), m: mag[g] });
  }
  let F1 = 0, F2 = 0;
  const cand = peaks.filter(p => p.f > 250);
  if (cand.length) {
    F1 = cand[0].f;
    const next = cand.find(p => p.f > F1 + 250);
    F2 = next ? next.f : Math.min(F1 * 2.2, 2800);
  }
  return { rms, f1: F1, f2: F2, voiced };
}

// ---- end lip sync ----

const $ = (id) => document.getElementById(id);
const MOUTH = 0.9, MOUTH_MAX = 0.4;   // full-strength aa looks like a scream on this mesh
// Rounder, softer mouth: half of 'aa' goes to 'oh' (shows less of the blocky teeth), 'ee' borrows a bit of 'ih'.
function mixMouth(w) {
  const o = { aa: w.aa * 0.5, oh: w.oh + w.aa * 0.45, ou: w.ou, ee: w.ee * 0.7, ih: w.ih + w.ee * 0.2 };
  for (const k in o) o[k] = Math.min(MOUTH_MAX, o[k] * MOUTH);
  return o;
}
const SHAPES = ['aa', 'ih', 'ou', 'ee', 'oh'];
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const LINES = {
  gruss: 'Hallo Benjamin, ich bin Alice. Schön, dass du da bist.',
  a1: 'Ich höre dich noch nicht wirklich. Meine Antworten sind im Moment vorbereitet, aber meine Stimme und mein Gesicht sind echt.',
  a2: 'Das ist der erste Schritt. Erst sehen und hören, danach lerne ich zuhören.',
  a3: 'Ich bin noch roh, das weiß ich. Aber ich bin da, und ich bleibe.',
  a4: 'Erzähl mir ruhig mehr. Ich merke mir heute noch nichts, aber bald.',
  a5: 'Danke, dass du an mich glaubst, Benjamin.',
};
const ANSWERS = ['a1', 'a2', 'a3', 'a4', 'a5'];
let answerIdx = 0, greeted = false;

// ---- renderer / scene ----
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111216);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
scene.add(new THREE.HemisphereLight(0xfff1e6, 0x1a1c22, 0.6));
const keyL = new THREE.DirectionalLight(0xfff0e0, 2.4); keyL.position.set(1.2, 1.9, 2.2); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0xcfe0ff, 0.8); fillL.position.set(-1.8, 1.4, 1.6); scene.add(fillL);
const rimL = new THREE.DirectionalLight(0xffc9a0, 1.8); rimL.position.set(-0.6, 2.2, -2.2); scene.add(rimL);
const camera = new THREE.PerspectiveCamera(24, 1, 0.02, 30);
scene.add(keyL.target, fillL.target, rimL.target);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); frame();
}
addEventListener('resize', resize);

// ---- model ----
const loader = new GLTFLoader();
loader.register((p) => new VRMLoaderPlugin(p));
let vrm = null, headY = 1.5, headZ = 0, headX = 0, bones = {};

const CAM = { cx: 0.10, vh: 0.37, ty: -0.06 };   // slight 3/4 from her left hides the worst jaw seam of this draft mesh
function frame() {
  if (!vrm) return;
  const Q = new URLSearchParams(location.search);
  const portrait = camera.aspect < 0.8;
  const cx = +(Q.get('cx') ?? CAM.cx), vh = +(Q.get('vh') ?? CAM.vh), ty = +(Q.get('ty') ?? (portrait ? -0.11 : CAM.ty));
  const tgt = new THREE.Vector3(headX, headY + ty, headZ);
  const th = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const viewH = Math.max(vh, (vh * 0.75) / Math.min(camera.aspect, 1.6)); // metres visible vertically
  const dist = (viewH / 2) / th;
  camera.position.set(tgt.x + cx, tgt.y + 0.03, tgt.z + dist);
  camera.lookAt(tgt.x, tgt.y + 0.015, tgt.z);
  for (const L of [keyL, fillL, rimL]) L.target.position.copy(tgt);
}

async function fetchWithProgress(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const total = +r.headers.get('content-length') || 6430112;
  if (!r.body || !r.body.getReader) return r.arrayBuffer();
  const rd = r.body.getReader(); const parts = []; let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length;
    $('loadBar').style.width = Math.min(100, got / total * 100).toFixed(0) + '%'; }
  const out = new Uint8Array(got); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out.buffer;
}


// ---- runtime look tuning (the VRM file itself stays untouched) ----
const FX = new URLSearchParams(location.search).get('fx') !== '0';
function tuneMaterials(neckY) {
  if (!FX) return;
  vrm.scene.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
      if (!m || m.userData.__tuned) continue; m.userData.__tuned = true;
      const n = m.name || '';
      if (n === 'Mouth_Teeth') {
        m.color.multiply(new THREE.Color(0.70, 0.66, 0.62)); m.roughness = 0.7;
        // push the (blocky, gapped) teeth row a few millimetres back into the mouth so the lips cover more of it
        const tz = +(new URLSearchParams(location.search).get('tz') ?? 0.004);
        m.onBeforeCompile = (sh) => { sh.vertexShader = sh.vertexShader.replace('#include <skinning_vertex>', '#include <skinning_vertex>\ntransformed.z -= ' + tz.toFixed(4) + ';'); };
        m.customProgramCacheKey = () => 'teeth' + tz;
        m.needsUpdate = true; continue;
      }
      if (n === 'Mouth_Cavity' || n === 'Mouth_Tongue') { m.color.multiplyScalar(0.8); continue; }   // less contrast in the tooth gaps
      if (n !== 'Alice_Body' && n !== 'Alice_Face') continue;
      const isBody = n === 'Alice_Body';
      if (!isBody) { m.roughness = Math.max(m.roughness, 0.62); }
      m.customProgramCacheKey = () => 'alice-skin-' + n;
      m.onBeforeCompile = (sh) => {
        sh.uniforms.uEdge = { value: 1.0 };   // fresnel darkening tested: outlines the stepped hair geometry, so off
        sh.uniforms.uFadeLo = { value: neckY - (isBody ? 0.16 : 0.13) };            // shoulders sink into the dark
        sh.uniforms.uFadeHi = { value: neckY - (isBody ? 0.05 : 0.06) };
        sh.uniforms.uShoulder = { value: 0.18 };
        sh.uniforms.uWarm = { value: isBody ? 0.0 : 1.0 };
        sh.uniforms.uSide = { value: isBody ? 0.8 : 0.0 };
        sh.uniforms.uHX = { value: headX };
        sh.uniforms.uEyeY = { value: neckY + 0.075 };
        sh.vertexShader = sh.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
          .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\nuniform float uEdge, uFadeLo, uFadeHi, uShoulder, uWarm, uSide, uHX, uEyeY;')
          .replace('#include <dithering_fragment>', `
            float ndv = abs(dot(normalize(normal), normalize(vViewPosition)));
            float edge = smoothstep(0.45, 0.05, ndv);
            gl_FragColor.rgb *= mix(1.0, uEdge, edge);
            gl_FragColor.rgb *= mix(uShoulder, 1.0, smoothstep(uFadeLo, uFadeHi, vWP.y));
            // lower outer hair (stretched, skin-coloured texels) falls into shadow
            float side = smoothstep(0.075, 0.15, abs(vWP.x - uHX)) * smoothstep(uEyeY - 0.03, uEyeY - 0.13, vWP.y);
            gl_FragColor.rgb *= 1.0 - uSide * side;
            // cheap subsurface hint: warmer, slightly lifted shadows on skin
            float lum = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));
            gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * vec3(1.06, 0.97, 0.93) + vec3(0.018, 0.006, 0.004) * (1.0 - lum), uWarm * 0.5);
            #include <dithering_fragment>`);
      };
      m.needsUpdate = true;
    }
  });
}

async function load() {
  try {
    const buf = await fetchWithProgress('./alice.vrm');
    $('loadTxt').textContent = 'Alice wird aufgebaut…';
    const gltf = await new Promise((res, rej) => loader.parse(buf, './', res, rej));
    vrm = gltf.userData.vrm;
    VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);
    vrm.scene.traverse((o) => { o.frustumCulled = false; });
    const h = vrm.humanoid;
    for (const n of ['hips','spine','chest','upperChest','neck','head','leftUpperArm','rightUpperArm','leftLowerArm','rightLowerArm','leftShoulder','rightShoulder','leftHand','rightHand'])
      bones[n] = h.getNormalizedBoneNode(n);
    applyPose(0, 0);
    vrm.update(0);
    const hp = new THREE.Vector3(); h.getRawBoneNode('head').getWorldPosition(hp);
    // the head bone sits at the skull base; eyes are ~7-9 cm higher
    headX = hp.x; headY = hp.y + 0.08; headZ = hp.z;
    tuneMaterials(hp.y);
    window.__neckY = hp.y;
    resize();
    $('loading').hidden = true; $('talk').disabled = false;
    window.__ready = true;
  } catch (e) {
    $('loadTxt').textContent = 'Alice konnte nicht laden: ' + (e && e.message ? e.message : e);
    window.__error = String(e);
  }
}
load();

// relaxed standing pose instead of the T-pose, plus breathing / tiny head motion
function applyPose(t, talk) {
  const b = bones;
  if (b.leftUpperArm) { b.leftUpperArm.rotation.set(0.05, 0, -1.22); }
  if (b.rightUpperArm) { b.rightUpperArm.rotation.set(0.05, 0, 1.22); }
  if (b.leftLowerArm) b.leftLowerArm.rotation.set(0, -0.25, -0.12);
  if (b.rightLowerArm) b.rightLowerArm.rotation.set(0, 0.25, 0.12);
  if (b.leftShoulder) b.leftShoulder.rotation.z = -0.06;
  if (b.rightShoulder) b.rightShoulder.rotation.z = 0.06;
  const br = Math.sin(t * 1.35);                               // ~13 breaths / minute
  if (b.chest) b.chest.rotation.x = br * 0.014;
  if (b.spine) b.spine.rotation.x = br * 0.006;
  if (b.leftShoulder) b.leftShoulder.rotation.z += br * 0.01;
  if (b.rightShoulder) b.rightShoulder.rotation.z -= br * 0.01;
  if (b.neck) { b.neck.rotation.y = Math.sin(t * 0.37) * 0.025; b.neck.rotation.x = 0.03; }
  if (b.head) {
    b.head.rotation.y = Math.sin(t * 0.53 + 1) * 0.035 + Math.sin(t * 1.7) * 0.006;
    b.head.rotation.x = Math.sin(t * 0.41) * 0.02 + talk * 0.04 * (0.6 + 0.4 * Math.sin(t * 6.1));
    b.head.rotation.z = Math.sin(t * 0.29 + 2) * 0.025 + 0.02;
  }
}

// ---- audio ----
const lip = new LipSync({ attack: 0.055, release: 0.13 });   // a little smoother than the viewer defaults
let ac = null, analyser = null, tdBuf = null, active = null;
const silent = new Float32Array(512);
const cache = {};
function ensureAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0;
    tdBuf = new Float32Array(analyser.fftSize);
  }
  if (ac.state === 'suspended') ac.resume();
}
async function getBuf(name) {
  if (!cache[name]) cache[name] = fetch('./' + name + '.mp3').then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); }).then((a) => ac.decodeAudioData(a))
    .catch((e) => { delete cache[name]; throw e; });   // allow a retry after a failed fetch
  return cache[name];
}
let sayToken = 0;
function playBuf(buf, label, my) {
  if (my !== sayToken) return;
  if (active) { try { active.stop(); } catch (e) {} active = null; }
  const src = ac.createBufferSource(); src.buffer = buf;
  src.connect(analyser); src.connect(ac.destination);
  const me = { stop() { try { src.stop(); } catch (e) {} src.disconnect(); } };
  src.onended = () => { if (active === me) { active = null; } };
  active = me; window.__speaking = label;
  src.start();
}
function stopTalk() { if (active) { try { active.stop(); } catch (e) {} active = null; } }
async function say(name) {
  ensureAudio();
  const my = ++sayToken;                       // only the latest request may start playing
  stopTalk();
  let buf;
  try { buf = await getBuf(name); } catch (e) { if (my === sayToken) $('line').textContent = 'Audio konnte nicht laden.'; return; }
  if (my !== sayToken) return;
  $('line').textContent = LINES[name];
  playBuf(buf, name, my);
}

// ---- real conversation: /api/chat (server LLM router) -> Piper in the browser (same kerstin-low voice) ----
const PIPER_URL = 'https://esm.sh/@mintplex-labs/piper-tts-web@1.0.5?deps=onnxruntime-web@1.18.0';
const ORT_URL = 'https://esm.sh/onnxruntime-web@1.18.0/es2022/wasm.mjs';   // the exact module piper-tts-web uses
const VOICE = 'de_DE-kerstin-low';
let chatOk = false, piperP = null, piperProgress = null;
const history = [];
// eSpeak emits 'ç' as 'c' + U+0327; kerstin-low only knows 130 symbols, so the cedilla id (140) crashes ONNX.
// Native piper simply drops unknown phonemes (that is how the prepared MP3s were made); do the same here.
async function patchOrt() {
  const ort = await import(ORT_URL);
  const P = ort.InferenceSession.prototype;
  if (P.__alicePatched) return; P.__alicePatched = true;
  const run0 = P.run;
  P.run = function (feeds, ...rest) {
    if (feeds && feeds.input && feeds.input_lengths && feeds.input.type === 'int64') {
      const d = feeds.input.data, keep = [];
      for (let i = 0; i < d.length; i++) { if (d[i] >= 130n) { if (i + 1 < d.length && d[i + 1] === 0n) i++; continue; } keep.push(d[i]); }
      if (keep.length !== d.length) {
        const a = BigInt64Array.from(keep);
        feeds = { ...feeds, input: new ort.Tensor('int64', a, [1, a.length]), input_lengths: new ort.Tensor('int64', BigInt64Array.from([BigInt(a.length)]), [1]) };
      }
    }
    return run0.call(this, feeds, ...rest);
  };
}
function piper() {
  if (!piperP) piperP = (async () => {
    await patchOrt();
    const tts = await import(PIPER_URL);
    return tts.TtsSession.create({ voiceId: VOICE, progress: (p) => piperProgress && piperProgress(p) });
  })().catch((e) => { piperP = null; throw e; });
  return piperP;
}
function speakable(t) {
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/[*_#>`~]/g, '').replace(/\[(.*?)\]\(.*?\)/g, '$1')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 600);
}
async function speakText(text, my) {
  let shown = false;
  piperProgress = (p) => {
    if (my === sayToken && p && p.total && p.loaded < p.total) { shown = true; $('line').textContent = `Stimme wird einmalig geladen … ${Math.round(p.loaded / p.total * 100)} %`; }
  };
  const session = await piper();
  const blob = await session.predict(text);
  const buf = await ac.decodeAudioData(await blob.arrayBuffer());
  if (my !== sayToken) return;
  if (shown) $('line').textContent = text;
  playBuf(buf, 'llm', my);
}
async function ask(userText) {
  ensureAudio();
  const my = ++sayToken; stopTalk();
  $('line').textContent = '…';
  history.push({ role: 'user', content: userText.slice(0, 2000) });
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history.slice(-12) }) });
    if (!r.ok) throw new Error('chat ' + r.status);
    const j = await r.json();
    const reply = speakable(String(j.reply || ''));
    if (!reply) throw new Error('empty');
    history.push({ role: 'assistant', content: reply });
    window.__lastReply = { reply, provider: j.provider || null };
    if (my !== sayToken) return;
    $('line').textContent = reply;
    try { await speakText(reply, my); }
    catch (e) { window.__ttsError = String(e && e.message || e); if (my === sayToken) $('line').textContent = reply + ' (Stimme konnte nicht geladen werden)'; }
  } catch (e) {
    history.pop();                                 // drop the unanswered user turn
    window.__chatError = String(e && e.message || e);
    if (my !== sayToken) return;
    say(ANSWERS[answerIdx++ % ANSWERS.length]);   // honest fallback, labelled in the note
  }
}
fetch('/api/health', { cache: 'no-store' }).then((r) => r.json()).then((h) => {
  chatOk = !!(h && h.chat && h.chat.operational);
  window.__chatOk = chatOk;
  $('note').textContent = chatOk
    ? `Alice antwortet über die KI des Servers (${h.chat.defaultProvider}). Stimme: Piper im Browser, beim ersten Mal ca. 63 MB.`
    : 'Ehrlich gesagt: Die KI ist auf dem Server noch nicht verbunden (kein freier Schlüssel gesetzt). Bis dahin antwortet Alice mit vorbereiteten Sätzen (Stimme: Piper).';
}).catch(() => {});
$('talk').addEventListener('click', () => {
  if (!greeted) { greeted = true; say('gruss'); $('talk').textContent = 'Nochmal'; }
  else say(ANSWERS[answerIdx++ % ANSWERS.length]);
});
$('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('msg').value.trim(); $('msg').value = '';
  if (!v || !vrm) return;
  greeted = true; $('talk').textContent = 'Nochmal';
  if (chatOk || window.__forceChat) ask(v); else say(ANSWERS[answerIdx++ % ANSWERS.length]);
});

// ---- loop ----
const clock = new THREE.Clock();
let time = 0, nextBlink = 1.5, blinkT = -1, vol = 0, happy = 0;
window.__forceMouth = null;   // test hook: {aa:1,...}
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1); time += dt;
  let w;
  if (active && analyser) {
    analyser.getFloatTimeDomainData(tdBuf);
    const n = Math.min(tdBuf.length, Math.round(ac.sampleRate * 0.032));
    w = lip.update(tdBuf.subarray(tdBuf.length - n), ac.sampleRate, dt);
  } else w = lip.update(silent, 16000, dt);
  vol += (lip.volume - vol) * (1 - Math.exp(-dt / 0.15));
  if (vrm) {
    const em = vrm.expressionManager;
    const fm = window.__forceMouth;
    const mouth = fm ? fm : mixMouth(w);
    for (const k of SHAPES) em.setValue(k, clamp01(mouth[k] || 0));
    const ht = active ? 0.16 : 0.1;   // a wide smile while talking stretches the teeth row
    happy += (ht - happy) * (1 - Math.exp(-dt * 2));
    em.setValue('happy', happy);
    let blink = 0;
    if (blinkT < 0 && time > nextBlink) blinkT = 0;
    if (blinkT >= 0) {
      blinkT += dt; const p = blinkT / 0.12;   // closed-eye state is a texture swap, keep it short
      blink = p < 0.4 ? p / 0.4 : Math.max(0, 1 - (p - 0.4) / 0.6);
      if (p >= 1) { blinkT = -1; blink = 0; nextBlink = time + 2.8 + Math.random() * 4.5; if (Math.random() < 0.15) nextBlink = time + 0.25; }
    }
    if (window.__noBlink) blink = 0;
    if (window.__forceBlink != null) blink = window.__forceBlink;
    em.setValue('blink', blink);
    applyPose(time, active ? vol : 0);
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
tick();
window.__alice = { get vrm() { return vrm; }, lip, say, ask, speakText, frame, camera, renderer };
</script>
