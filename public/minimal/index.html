<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alice – minimal</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;background:#111;color:#eee;font:16px sans-serif;display:flex;flex-direction:column;height:100vh}
model-viewer{flex:1;width:100%;background:#222}form{display:flex;gap:8px;padding:12px}input{flex:1;padding:10px;font-size:16px}button{padding:10px 16px;font-size:16px}#log{padding:0 12px 12px;min-height:1.5em}</style></head>
<body><model-viewer src="alice.glb" alt="Alice" camera-controls auto-rotate exposure="1" shadow-intensity="1"></model-viewer>
<div id="log">Klick „Hallo Alice“ oder schreib etwas.</div>
<form id="f"><button type="button" id="hi">Hallo Alice</button><input id="t" placeholder="Sag etwas zu Alice …"><button>Senden</button></form>
<script>
const log=document.getElementById('log'),greet=new Audio('greeting.mp3');
function say(x){log.textContent='Alice: '+x;const u=new SpeechSynthesisUtterance(x);u.lang='de-DE';
 const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('de'));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}
document.getElementById('hi').onclick=()=>{log.textContent='Alice: Hallo Benjamin. Ich bin Alice.';greet.currentTime=0;greet.play();};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=document.getElementById('t').value.trim();if(!t)return;
 say('Du hast gesagt: '+t+'. Ich höre dich.');document.getElementById('t').value='';};
</script></body></html>
