      "persistent_state_valid",
      "interaction_input_available",
      "output_path_available"
    ],
    "does_not_require": [
      "camera",
      "cloud",
      "vrm",
      "lip_sync",
      "neural_tts",
      "local_llm"
    ]
  },
  "pipeline_order": [
    "mic",
    "vad",
    "stt",
    "agent",
    "tts",
    "playback",
    "avatar"
  ],
